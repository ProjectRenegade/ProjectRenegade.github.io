<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Portfolio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { min-height: 100vh; background: radial-gradient(circle at 20% 20%, #1e1b4b 0%, #0f172a 40%, #020617 100%); display: flex; justify-content: center; align-items: center; padding: 1rem; color: #1e293b; }
        .portfolio-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.5); width: 100%; max-width: 400px; border-radius: 24px; padding: 2rem 1.5rem; text-align: center; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3); }
        .profile-container { width: 90px; height: 90px; margin: 0 auto 1rem auto; }
        .profile-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid #fff; }
        .channel-name { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.25rem; color: #0f172a; }
        .channel-handle { color: #64748b; font-size: 0.9rem; margin-bottom: 1.5rem; font-weight: 600; }
        .live-counter-box { background: linear-gradient(135deg, #ff7e5f 0%, #feb47b 100%); border-radius: 16px; padding: 1rem; margin-bottom: 1.5rem; transition: cubic-bezier(0.175, 0.885, 0.32, 1.4) 0.3s; }
        .live-counter-box:hover { transform: scale(1.05); box-shadow: 0 15px 30px rgba(255, 126, 95, 0.4); }
        .counter-label { color: #fff; font-size: 0.7rem; font-weight: 700; letter-spacing: 1px; }
        .odometer-number { color: #fff; font-size: 1.8rem; font-weight: 700; }
        .links-wrapper { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.5rem; }
        .portfolio-link { display: block; background: #fff; color: #1e293b; text-decoration: none; padding: 0.9rem; border-radius: 12px; font-weight: 700; font-size: 0.75rem; border: 1px solid rgba(0,0,0,0.05); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: 0.2s ease; }
        .portfolio-link:hover { transform: translateY(-2px); color: #ff7e5f; }
        .fact-banner-box { display: flex; flex-direction: column; justify-content: center; align-items: center; background: #0f172a; border-radius: 16px; padding: 1.2rem; min-height: 100px; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); }
        .fact-label { color: #ff7e5f; font-size: 0.7rem; font-weight: 700; letter-spacing: 1px; margin-bottom: 4px; }
        .fact-text { color: #f8fafc; font-size: 0.85rem; line-height: 1.4; width: 100%; word-wrap: break-word; }
    </style>
</head>
<body>
    <div class="portfolio-card">
        <div class="profile-container"><img src="profile.png" class="profile-img"></div>
        <h1 class="channel-name">Project Renegade</h1>
        <p class="channel-handle">@ProjectRenegadeHQ</p>
        <div class="live-counter-box">
            <p class="counter-label">Live Subscribers</p>
            <div class="odometer-number">5</div>
        </div>
        <div class="links-wrapper">
            <!-- 🔗 LINK FIXED DIRECTLY TO YOUR REAL CHANNEL HOME PAGE -->
            <a href="https://www.youtube.com/@ProjectRenegadeHQ" target="_blank" class="portfolio-link">https://www.youtube.com/@ProjectRenegadeHQ</a>
            <a href="https://instagram.com" target="_blank" class="portfolio-link">Follow on Instagram</a>
            <a href="mailto:yourbrand@email.com" class="portfolio-link">Business Inquiries</a>
        </div>
        <div class="fact-banner-box" onclick="generateFact()">
            <span class="fact-label">Minecraft Trivia</span>
            <div class="fact-text" id="fact-content">Loading...</div>
        </div>
    </div>
    <script>
        const facts = [
            "A Minecraft world is 7 times larger than planet Earth!", 
            "Creepers were a bug where a pig model's length and height were flipped.", 
            "Endermen sounds are British voices slowed down and reversed.", 
            "Ghast screeches were recorded from the developer's sleeping cat.", 
            "Naming an animal 'Dinnerbone' flips them completely upside down.", 
            "Naming a sheep 'jeb_' makes its wool cycle a shifting rainbow color.", 
            "Minecraft's first alpha version was coded in just six days in 2009.", 
            "If a lightning bolt hits a pig, it becomes a Zombie Pigman.", 
            "An Enderman cannot pick up blocks if standing in water or rain.", 
            "Gold tools break blocks fastest but have the lowest durability."
        ];
        let lastIndex = -1;
        function generateFact() {
            let nextIndex = lastIndex;
            while (nextIndex === lastIndex) { nextIndex = Math.floor(Math.random() * facts.length); }
            lastIndex = nextIndex;
            document.getElementById('fact-content').innerText = facts[nextIndex];
        }
        generateFact();
    </script>
</body>
</html>
